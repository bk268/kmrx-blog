# ===================================
# Butterfly 主题配置
# ===================================

# 导航栏菜单
menu:
  首页: / || fas fa-home
  文章: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  友链: /link/ || fas fa-link
  搜索: /search/ || fas fa-search
  关于: /about/ || fas fa-user

# ===================================
# 1. 网站标识
# ===================================
# 网站图标（浏览器标签页）
favicon: /img/logo.jpg
# 作者头像（侧边栏）
avatar:
  img: /img/avatar.jpg
  effect: true

# ===================================
# 2. 首页顶部大图（Banner）
# ===================================
index_img: /img/banner.jpg
subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 分享技术，记录生活
    - 探索未知的世界
    - 保持热爱，奔赴山海

# ===================================
# 3. 导航栏美化
# ===================================
nav:
  logo: /img/logo.jpg
  display_title: true
  fixed: true

# ===================================
# 4. 页面背景
# ===================================
background:
  enable: true
  # 纯色背景
  # color: '#f5f5f5'
  # 图片背景
  url: /img/bg.jpg
  blur: 0

aside:
  enable: false

# ===================================
# 5. 文章列表样式
# ===================================
default_cover: /img/default-cover.jpg
index_post_content:
  method: 2      # 0=全宽, 1=卡片, 2=迷你
  length: 500    # 摘要长度

# ===================================
# 6. 页脚
# ===================================
footer:
  owner:
    enable: true
    since: 2026
  custom_text: |
    <div style="text-align: center; margin: 10px 0;">
      <span>🚀 使用 Hexo + Butterfly 构建</span>
      <br>
      <span>📧 联系邮箱: 2909598545@qq.com</span>
    </div>
  privacy: false
  copyright: true

# ===================================
# 7. 特效开关
# ===================================
click_heart:
  enable: true
  mobile: false
cursor_effect:
  enable: false
  type: love
readmode: true
rightside_scroll: true

# ===================================
# 8. 自定义注入（站点子路径下用 /kmrx-blog/ 前缀）
# ===================================
inject:
  head:
    - <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    - <link rel="stylesheet" href="/kmrx-blog/css/custom.css">

# ===================================
# 评论系统（已按要求关闭）
# ===================================
comments:
  use: false          # 暂不启用评论系统

# ===================================
# 社交链接
# ===================================
social:
  Github: https://github.com/bk268 || fab fa-github || GitHub
  Email: mailto:2909598545@qq.com || fas fa-envelope || 邮箱
  Rss: /atom.xml || fas fa-rss || Rss

# ===================================
# 动态特效（方案 A）
# ===================================
# 粒子背景
canvas_nest:
  enable: true
  color: '187,134,252'      # 紫调，契合整体配色
  opacity: 0.5
  zIndex: -1
  count: 99
  mobile: true

# 点击烟花特效
fireworks:
  enable: true
  zIndex: 9999
  mobile: true

# 深色模式
darkmode: true

# 页面预加载动画
preloader:
  enable: true
  type: pace
  pace_color: 1e90ff

# ===================================
# 本地搜索（方案 B）
# ===================================
search:
  # 使用本地搜索
  use: local_search
  placeholder: 搜索文章...
  local_search:
    preload: true
    top_n_per_article: 1
    unescape: false

# ===================================
# 访客统计与字数统计（方案 B）
# ===================================
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# 文章字数 / 阅读时长
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# ===================================
# 友情链接卡片（方案 B）
# ===================================
flink:
  - class_name: 友情链接
    class_desc: 我的一些伙伴
    link_list:
      - name: GitHub
        link: https://github.com
        avatar: https://github.com/favicon.ico
        descr: 全球最大的代码托管平台
      - name: Hexo
        link: https://hexo.io
        avatar: https://hexo.io/favicon.ico
        descr: 快速、简洁且高效的博客框架