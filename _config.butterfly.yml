# ===================================
# Butterfly 主题配置
# ===================================

# 导航栏菜单
menu:
  首页: / || fas fa-home
  文章: /archives/ || fas fa-archive
  关于: /about/ || fas fa-user

# ===================================
# 1. 网站标识
# ===================================
# 网站图标（浏览器标签页）
favicon: /img/logo.jpg
# 作者头像（侧边栏）
avatar:
  img: /img/avatar.jpg
  effect: true

# ===================================
# 2. 首页顶部大图（Banner）
# ===================================
index_img: /img/banner.jpg
subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 分享技术，记录生活
    - 探索未知的世界
    - 保持热爱，奔赴山海

# ===================================
# 3. 导航栏美化
# ===================================
nav:
  logo: /img/logo.jpg
  display_title: true
  fixed: true

# ===================================
# 4. 页面背景
# ===================================
background:
  enable: true
  # 纯色背景
  # color: '#f5f5f5'
  # 图片背景
  url: /img/bg.jpg
  blur: 0

aside:
  enable: false

# ===================================
# 5. 文章列表样式
# ===================================
default_cover: /img/default-cover.jpg
index_post_content:
  method: 2      # 0=全宽, 1=卡片, 2=迷你
  length: 500    # 摘要长度

# ===================================
# 6. 页脚
# ===================================
footer:
  owner:
    enable: true
    since: 2026
  custom_text: |
    <div style="text-align: center; margin: 10px 0;">
      <span>🚀 使用 Hexo + Butterfly 构建</span>
      <br>
      <span>📧 联系邮箱: 2909598545@qq.com</span>
    </div>
  privacy: false
  copyright: true

# ===================================
# 7. 特效开关
# ===================================
click_heart:
  enable: true
  mobile: false
cursor_effect:
  enable: false
  type: love
readmode: true
rightside_scroll: true

# ===================================
# 8. 自定义注入（站点子路径下用 /kmrx-blog/ 前缀）
# ===================================
inject:
  head:
    - <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    - <link rel="stylesheet" href="/kmrx-blog/css/custom.css">

# ===================================
# 评论系统（后续配置）
# ===================================
comments:
  use: waline  # 或 twikoo, gitalk