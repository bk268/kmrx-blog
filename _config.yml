# ===================================
# 站点核心配置
# ===================================

# 网站标题 / 副标题 / 描述
title: kmrx-blog
subtitle: 分享技术，记录生活
description: 个人技术博客，记录学习与生活日常
keywords: Hexo, Butterfly, 博客, 技术分享
author: bk268
language: zh-CN
timezone: Asia/Shanghai

# ===================================
# URL 配置（GitHub Pages 项目站点，部署在 /kmrx-blog/ 子路径）
# ===================================
url: https://bk268.github.io/kmrx-blog/
root: /kmrx-blog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ===================================
# 目录配置
# ===================================
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ===================================
# 写作配置
# ===================================
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# ===================================
# 首页生成
# ===================================
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# ===================================
# 分类与标签
# ===================================
default_category: uncategorized
category_map:
tag_map:

# ===================================
# 元数据 / 日期格式
# ===================================
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# ===================================
# 分页
# ===================================
per_page: 10
pagination_dir: page

# ===================================
# 主题
# ===================================
theme: butterfly

# ===================================
# 部署（GitHub Pages 由 .github/workflows/pages.yml 的 Actions 自动构建部署，
# 无需在此配置 deploy。若使用 gh-pages 分支方式，可在此启用 hexo-deployer-git）
# ===================================
# deploy:
#   type: git
#   repo: https://github.com/bk268/kmrx-blog.git
#   branch: gh-pages

# ===================================
# 搜索配置
# ===================================
search:
  path: search.xml
  field: post
  content: true
  format: html

# Feed 配置
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  icon: icon.png
  autodiscovery: true

# Sitemap 配置
sitemap:
  path: sitemap.xml
baidusitemap:
  path: baidusitemap.xml